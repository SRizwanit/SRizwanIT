name: Render Rizwan Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "stills/hd/4k/both = 16:9 | vertical-stills/vertical = 9:16 (1080x1920) | feed-stills/feed = 4:5 FEED (1080x1350) | covers = thumbnails (3 PNGs)"
        type: choice
        default: stills
        options: [stills, hd, 4k, both, vertical-stills, vertical, feed-stills, feed, covers]
      release:
        description: "Also publish the MP4(s) as a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required files exist in repo root
        run: |
          missing=0
          for f in mypicture.jpg background.mp3 \
            sfx-whoosh.wav sfx-pop.wav sfx-thud.wav sfx-ding.wav SfxTrack.tsx \
            app-islami-bishwakosh-s2.jpg app-islami-bishwakosh.jpg app-shohidullah.jpg \
            app-osman-goni.jpg app-tablig.jpg app-usila.jpg app-rizwantask.png \
            web-islami-bishwakosh-s2.jpg web-islamipedia-ai.jpg web-rizwantask.jpg \
            package.json index.ts Root.tsx Video.tsx Scenes.tsx Components.tsx \
            VideoVertical.tsx ScenesVertical.tsx \
            VideoFeed.tsx ScenesFeed.tsx Icons.tsx Cover.tsx \
            AudioTrack.tsx theme.ts fonts.ts remotion.config.ts assets.d.ts; do
            if [ ! -f "$f" ]; then echo "::error::MISSING FILE: $f"; missing=1; fi
          done
          exit $missing
      - name: Build render matrix
        id: m
        run: |
          mode="${{ github.event.inputs.mode }}"
          HD='{"name":"HD","scale":1,"crf":14,"comp":"Intro"}'
          K4='{"name":"4K","scale":2,"crf":15,"comp":"Intro"}'
          VT='{"name":"Vertical-HD","scale":1,"crf":14,"comp":"IntroVertical"}'
          FD='{"name":"Feed-HD","scale":1,"crf":14,"comp":"IntroFeed"}'
          case "$mode" in
            hd)   m="{\"include\":[$HD]}" ;;
            4k)   m="{\"include\":[$K4]}" ;;
            both) m="{\"include\":[$HD,$K4]}" ;;
            vertical) m="{\"include\":[$VT]}" ;;
            feed) m="{\"include\":[$FD]}" ;;
            *)    m="{\"include\":[]}" ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  stills:
    needs: preflight
    if: ${{ github.event.inputs.mode == 'stills' || github.event.inputs.mode == 'vertical-stills' || github.event.inputs.mode == 'feed-stills' || github.event.inputs.mode == 'covers' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chrome system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 || true
      - name: Auto-fix Remotion versions (keep pinned if it exists, else latest 4.x)
        run: |
          cat > "$RUNNER_TEMP/pin.js" <<'JS'
          const {execSync} = require('child_process');
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const all = JSON.parse(execSync('npm view remotion versions --json', {encoding: 'utf8'}));
          const v4 = all
            .filter((v) => /^4\.\d+\.\d+$/.test(v))
            .sort((a, b) => {
              const x = a.split('.').map(Number), y = b.split('.').map(Number);
              return x[1] - y[1] || x[2] - y[2];
            });
          const latest = v4[v4.length - 1];
          const cur = pkg.dependencies.remotion;
          const target = all.includes(cur) ? cur : latest;
          for (const k of Object.keys(pkg.dependencies)) {
            if (k === 'remotion' || k.startsWith('@remotion/')) pkg.dependencies[k] = target;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('Pinned:', cur, '->', target, '(latest 4.x =', latest + ')');
          JS
          node "$RUNNER_TEMP/pin.js"
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx remotion browser ensure
      - name: Pick composition (16:9 / 9:16 / 4:5)
        run: |
          case "${{ github.event.inputs.mode }}" in
            vertical-stills) echo "COMP=IntroVertical" >> "$GITHUB_ENV" ;;
            feed-stills) echo "COMP=IntroFeed" >> "$GITHUB_ENV" ;;
            *) echo "COMP=Intro" >> "$GITHUB_ENV" ;;
          esac
      - name: Composition sanity check
        run: npx remotion compositions index.ts
      - name: Render preview stills
        run: |
          if [ "${{ github.event.inputs.mode }}" = "covers" ]; then
            # static thumbnails for all three formats
            npx remotion still index.ts CoverWide "cover-wide-16x9.png"
            npx remotion still index.ts CoverVertical "cover-vertical-9x16.png"
            npx remotion still index.ts CoverFeed "cover-feed-4x5.png"
          else
            # moments with the most on screen (scene starts: 0,108,354,597,770,908)
            for f in 80 200 330 420 520 720 860 1000; do
              npx remotion still index.ts "$COMP" "still-$COMP-$(printf %03d $f).png" --frame=$f
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stills
          path: |
            still-*.png
            cover-*.png

  render:
    needs: preflight
    if: ${{ github.event.inputs.mode != 'stills' && github.event.inputs.mode != 'vertical-stills' && github.event.inputs.mode != 'feed-stills' && github.event.inputs.mode != 'covers' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chrome system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 || true
      - name: Auto-fix Remotion versions (keep pinned if it exists, else latest 4.x)
        run: |
          cat > "$RUNNER_TEMP/pin.js" <<'JS'
          const {execSync} = require('child_process');
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const all = JSON.parse(execSync('npm view remotion versions --json', {encoding: 'utf8'}));
          const v4 = all
            .filter((v) => /^4\.\d+\.\d+$/.test(v))
            .sort((a, b) => {
              const x = a.split('.').map(Number), y = b.split('.').map(Number);
              return x[1] - y[1] || x[2] - y[2];
            });
          const latest = v4[v4.length - 1];
          const cur = pkg.dependencies.remotion;
          const target = all.includes(cur) ? cur : latest;
          for (const k of Object.keys(pkg.dependencies)) {
            if (k === 'remotion' || k.startsWith('@remotion/')) pkg.dependencies[k] = target;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('Pinned:', cur, '->', target, '(latest 4.x =', latest + ')');
          JS
          node "$RUNNER_TEMP/pin.js"
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx remotion browser ensure
      - name: Render ${{ matrix.name }}
        run: |
          npx remotion render index.ts ${{ matrix.comp }} "Rizwan-${{ matrix.name }}.mp4" \
            --codec=h264 --crf=${{ matrix.crf }} --scale=${{ matrix.scale }} \
            --audio-codec=aac
      - name: Show output info
        run: |
          ls -lh Rizwan-*.mp4
          npx remotion ffprobe "Rizwan-${{ matrix.name }}.mp4" 2>&1 | grep -E "Duration|Stream" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Rizwan-${{ matrix.name }}
          path: Rizwan-${{ matrix.name }}.mp4
          retention-days: 14

  release:
    needs: render
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Rizwan-*
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" Rizwan-*.mp4 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Rizwan Video #${{ github.run_number }}" \
            --notes "Rendered by GitHub Actions (mode: ${{ github.event.inputs.mode }})."
